# Builds the Windows installer (.exe) and a portable zip on a Windows machine, then starts the app and takes a
# screenshot to show it opens. Run it from the Actions tab ("Run workflow"); it also runs for every v* tag.
name: Windows build
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to attach the Windows files to (leave empty to keep them only as build files)
        default: v0.15.0
  push:
    tags: ['v*']
    branches: [main]
    paths: ['src/**', 'package.json', 'electron-builder.yml', 'build/**', '.github/workflows/windows.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the app's libraries (Windows versions of FFmpeg and the image library)
        run: npm install --omit=dev --no-audit --no-fund

      - name: Speech engine for Windows (whisper.cpp) and its model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force speech-win | Out-Null
          # Pinned: the newest whisper.cpp releases (v1.9.3 and later) no longer include the plain Windows x64 build.
          $tag = 'v1.9.2'
          Invoke-WebRequest "https://github.com/ggml-org/whisper.cpp/releases/download/$tag/whisper-bin-x64.zip" -OutFile whisper.zip
          Expand-Archive whisper.zip -DestinationPath whisper
          Get-ChildItem whisper -Recurse -Include *.exe,*.dll | Copy-Item -Destination speech-win
          if (-not (Test-Path speech-win/whisper-cli.exe)) { throw "whisper-cli.exe missing from whisper.cpp $tag" }
          Invoke-WebRequest https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin -OutFile speech-win/ggml-small-q5_1.bin
          "whisper.cpp $tag"

      - name: Windows tool programs and data (qpdf, the cut-out model, Tesseract languages)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force win-res/qpdf, win-res/models, win-res/tessdata | Out-Null
          $headers = @{ Authorization = "Bearer ${{ github.token }}" }
          $releases = Invoke-RestMethod 'https://api.github.com/repos/qpdf/qpdf/releases?per_page=10' -Headers $headers
          $asset = $releases | ForEach-Object { $_.assets } | Where-Object name -like '*-msvc64.zip' | Select-Object -First 1
          if (-not $asset) { throw 'No qpdf msvc64 build found' }
          Invoke-WebRequest $asset.browser_download_url -OutFile qpdf.zip
          Expand-Archive qpdf.zip -DestinationPath qpdf-x
          $bin = Get-ChildItem qpdf-x -Recurse -Filter qpdf.exe | Select-Object -First 1
          Copy-Item (Join-Path $bin.DirectoryName '*') win-res/qpdf -Recurse
          Get-ChildItem qpdf-x -Recurse -Include LICENSE*,NOTICE* | Select-Object -First 2 | Copy-Item -Destination win-res/qpdf
          Invoke-WebRequest https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx -OutFile win-res/models/isnet-general-use.onnx
          foreach ($lang in 'eng','hin') { Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile "win-res/tessdata/$lang.traineddata" }
          "qpdf: $($asset.name)"; Get-ChildItem win-res -Recurse -File | Format-Table FullName, Length

      - name: Test the Windows tools (repository)
        shell: pwsh
        env:
          VV_WIN_RESOURCES: ${{ github.workspace }}\win-res
        run: |
          $out = node tools/win_tools_test.cjs 2>&1 | Out-String; $code = $LASTEXITCODE; $out
          $lines = $out -split "`r?`n"
          $lines | Where-Object { $_ -like 'FAIL*' } | ForEach-Object { "::error title=Windows tools (repository)::$_" }
          "::notice title=Windows tools (repository)::$(($lines | Where-Object { $_ -like 'ok*' -or $_ -like '*passed*' -or $_ -like '*failed' }) -join ' | ')"
          if ($code -ne 0) { throw 'Windows tool tests failed' }

      - name: Write the version into the page and loader
        run: node -e "const fs=require('fs'),v=require('./package.json').version;for(const f of ['src/index.html','src/bootstrap.js'])fs.writeFileSync(f,fs.readFileSync(f,'utf8').replaceAll('__VERSION__',v));"

      - name: Build the installer and the portable zip
        run: npx --yes electron-builder@26 --win --x64 --publish never

      - name: Test the Windows tools (inside the packaged app)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $out = & "dist-win/win-unpacked/Video Visor.exe" tools/win_tools_test.cjs --packaged 2>&1 | Out-String; $code = $LASTEXITCODE; $out
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          $lines = $out -split "`r?`n"
          $lines | Where-Object { $_ -like 'FAIL*' } | ForEach-Object { "::error title=Windows tools (packaged)::$_" }
          "::notice title=Windows tools (packaged)::$(($lines | Where-Object { $_ -like 'ok*' -or $_ -like '*passed*' -or $_ -like '*failed' }) -join ' | ')"
          if ($code -ne 0) { throw 'Windows tool tests failed in the packaged app' }

      - name: Start the app and take a screenshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $exe = Get-ChildItem dist-win/win-unpacked -Filter 'Video Visor.exe' | Select-Object -First 1
          $p = Start-Process $exe.FullName -PassThru -RedirectStandardOutput smoke/stdout.txt -RedirectStandardError smoke/stderr.txt
          Start-Sleep -Seconds 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/smoke/screenshot.png")
          if ($p.HasExited) { "The app closed by itself (exit code $($p.ExitCode))" | Out-File smoke/result.txt; Get-Content smoke/stderr.txt; throw 'The app did not stay open' }
          'The app started and was still running after 30 seconds' | Out-File smoke/result.txt
          Stop-Process -Id $p.Id -Force
          Get-ChildItem dist-win -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Video-Visor-windows
          path: |
            dist-win/Video-Visor-*.exe
            dist-win/Video-Visor-*.zip
            smoke/
          if-no-files-found: warn

      - name: Attach the Windows files to the release
        if: success() && (github.event_name == 'push' || inputs.release != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a v* tag goes to its own release; a change on main refreshes the current release's Windows files
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } elseif ('${{ github.event_name }}' -eq 'push') { 'v' + (Get-Content package.json | ConvertFrom-Json).version } else { '${{ inputs.release }}' }
          Copy-Item smoke/screenshot.png "dist-win/Video-Visor-windows-start-up.png"
          gh release view $tag --repo ${{ github.repository }} | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Release $tag does not exist yet: publish it first, then run this again" }
          gh release upload $tag (Get-ChildItem dist-win/Video-Visor-*.exe, dist-win/Video-Visor-*.zip, dist-win/Video-Visor-windows-start-up.png).FullName --clobber --repo ${{ github.repository }}
